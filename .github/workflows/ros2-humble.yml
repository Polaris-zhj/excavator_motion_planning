name: ROS 2 Humble CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ros2-humble-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up ROS 2 Humble
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: humble
      - name: Install dependencies
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          sudo apt-get update
          sudo apt-get install -y ros-humble-xacro ros-humble-rviz2 \
            ros-humble-robot-state-publisher
          rosdep update
          rosdep install --from-paths src --ignore-src -r -y
      - name: Build
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --symlink-install --event-handlers console_direct+
      - name: Test
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          colcon test --event-handlers console_direct+
          colcon test-result --verbose
      - name: Validate Xacro
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          xacro src/excavator_description/urdf/excavator.urdf.xacro > /tmp/excavator.urdf
          test -s /tmp/excavator.urdf
